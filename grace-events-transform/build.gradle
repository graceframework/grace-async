dependencies {
    api project(":grace-events-core")
    api "jakarta.annotation:jakarta.annotation-api"
    compileOnly "org.graceframework:grace-datastore-core:$gormVersion", {
        transitive = false
    }
    compileOnly "org.graceframework:grace-datastore-gorm:$gormVersion", {
        transitive = false
    }

    testRuntimeOnly "org.springframework:spring-aop"
    testRuntimeOnly "org.springframework:spring-expression"
    testImplementation "org.graceframework:grace-datastore-gorm-test:$gormVersion", {
        exclude group:'org.graceframework', module:'grace-datastore-gorm-validation'
    }
}